services:
  alarm-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: alarm-simulator:latest
    container_name: network_alarm_simulator
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - 9019:8000
    env_file:
      - .env
    volumes:
      - /root/simulator/simulator:/app
      - simulator-data:/app/data
    networks:
      simulator_network:
        ipv4_address: 180.75.0.64

networks:
  simulator_network:
    external: true
    name: cplatform_iktara_cPlatform

volumes:
  simulator-data:
